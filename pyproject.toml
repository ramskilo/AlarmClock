[tool.poetry]
name = "alarmclock"
version = "0.1.0"
description = "Alarm Clock"
authors = ["Ramskilo <ramskilo@gmail.com>"]
license = "GPL"
readme = "README.md"
packages = [{include = "alarmclock", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.poetry.scripts]
alarm = "alarmclock.main:main"
