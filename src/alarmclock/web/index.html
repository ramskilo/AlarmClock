<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alarm Clock Control</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f1e8;
      --muted: #a7aca8;
      --panel: #192222;
      --line: #34403e;
      --accent: #f0b35a;
      --accent-strong: #f2cb83;
      --danger: #e87868;
      --bg: #0d1415;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 20% 0%, #263a38 0, transparent 38%), var(--bg);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 56px 0 48px;
    }

    header { margin-bottom: 34px; }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 560px;
      font-size: clamp(40px, 8vw, 76px);
      font-weight: 400;
      line-height: .95;
    }

    .intro {
      max-width: 470px;
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--panel) 90%, transparent);
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    button {
      min-height: 116px;
      padding: 18px 14px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--ink);
      background: #222d2b;
      cursor: pointer;
      font: 700 17px Georgia, "Times New Roman", serif;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    button:hover { border-color: var(--accent); background: #2d3936; transform: translateY(-2px); }
    button:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 3px; }
    button:disabled { cursor: wait; opacity: .6; transform: none; }
    button[data-command="stop"] { color: var(--danger); }
    button[data-command="snooze"] { color: var(--accent-strong); }

    button span {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 13px ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .status strong { color: var(--ink); font-weight: 400; }

    @media (max-width: 560px) {
      main { padding-top: 34px; }
      .panel { padding: 14px; }
      .actions { grid-template-columns: 1fr; }
      button { min-height: 76px; text-align: left; }
      button span { display: inline; margin-left: 8px; }
      .status { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">Local alarm control</p>
      <h1>Keep the morning in your hands.</h1>
      <p class="intro">Send a command to the alarm running on this computer.</p>
    </header>

    <section class="panel" aria-label="Alarm controls">
      <div class="actions">
        <button data-command="snooze" type="button">Snooze<span>+5 minutes</span></button>
        <button data-command="stop" type="button">Stop<span>finish current song</span></button>
        <button data-command="skip" type="button">Skip<span>next song</span></button>
      </div>
      <div class="status" aria-live="polite">
        <span id="message">Checking alarm...</span>
        <strong id="state">--</strong>
      </div>
    </section>
  </main>

  <script>
    const message = document.querySelector("#message");
    const state = document.querySelector("#state");
    const buttons = document.querySelectorAll("button[data-command]");

    function showStatus(text, tone) {
      message.textContent = text;
      message.style.color = tone === "error" ? "#e87868" : "";
    }

    async function refreshStatus() {
      try {
        const response = await fetch("/status");
        if (!response.ok) throw new Error("status request failed");
        const data = await response.json();
        state.textContent = data.stopped ? "Stopped" : data.snoozed ? "Snoozed" : "Waiting";
        if (message.textContent === "Checking alarm...") showStatus("Ready", "ok");
      } catch (error) {
        state.textContent = "Offline";
        showStatus("Could not reach the alarm server", "error");
      }
    }

    async function sendCommand(command, button) {
      button.disabled = true;
      showStatus("Sending " + command + "...", "ok");
      try {
        const response = await fetch("/" + command, { method: "POST" });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "request failed");
        showStatus(command[0].toUpperCase() + command.slice(1) + " accepted", "ok");
        await refreshStatus();
      } catch (error) {
        showStatus(error.message, "error");
      } finally {
        button.disabled = false;
      }
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => sendCommand(button.dataset.command, button));
    });

    refreshStatus();
    window.setInterval(refreshStatus, 15000);
  </script>
</body>
</html>
